---
plugin: networktocode.nautobot.inventory

validate_certs: true

config_context: true

group_by:
  - locations
  - platforms
  - device_roles

rename_variables:
  - pattern: "^tags$"
    repl: "nautobot_tags"
groups:
  hyperv_linux_guests: >-
    is_virtual | default(false) | bool
    and
    (
      platform | default('') | string | lower
      | regex_search('ubuntu|debian|rocky|almalinux|centos|fedora|rhel|red.hat|suse|linux')
    ) is not none
