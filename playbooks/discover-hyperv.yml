---
- name: Discover Hyper-V virtual machines
  hosts: NFV-Vhost-04
  gather_facts: false

  tasks:
    - name: Collect Hyper-V virtual machines
      ansible.windows.win_powershell:
        script: |
          $vms = @(
              foreach ($vm in (Get-VM)) {

                  # Collect network adapters
                  $networkAdapters = @(
                      foreach ($nic in (Get-VMNetworkAdapter -VM $vm)) {
                          @{
                              Name = $nic.Name
                              SwitchName = $nic.SwitchName
                              MacAddress = $nic.MacAddress
                              IPAddresses = @($nic.IPAddresses)
                          }
                      }
                  )

                  # Collect virtual hard disks
                  $hardDisks = @(
                      foreach ($disk in (Get-VMHardDiskDrive -VM $vm)) {

                          $vhd = Get-VHD -Path $disk.Path -ErrorAction SilentlyContinue

                          @{
                              Path = $disk.Path
                              ControllerType = $disk.ControllerType.ToString()
                              ControllerNumber = $disk.ControllerNumber
                              ControllerLocation = $disk.ControllerLocation

                              SizeGB = if ($null -ne $vhd) {
                                  [math]::Round($vhd.Size / 1GB, 2)
                              } else {
                                  $null
                              }

                              FileSizeGB = if ($null -ne $vhd) {
                                  [math]::Round($vhd.FileSize / 1GB, 2)
                              } else {
                                  $null
                              }
                          }
                      }
                  )

                  # Build VM inventory object
                  @{
                      Name = $vm.Name
                      VMId = $vm.VMId.ToString()
                      Hypervisor = $env:COMPUTERNAME
                      State = $vm.State.ToString()
                      Generation = $vm.Generation
                      ProcessorCount = $vm.ProcessorCount

                      MemoryStartupMB = [math]::Round(
                          $vm.MemoryStartup / 1MB
                      )

                      MemoryAssignedMB = [math]::Round(
                          $vm.MemoryAssigned / 1MB
                      )

                      DynamicMemoryEnabled = $vm.DynamicMemoryEnabled

                      NetworkAdapters = $networkAdapters
                      HardDisks = $hardDisks
                  }
              }
          )

          ConvertTo-Json -InputObject $vms -Depth 10 -Compress
      register: hyperv_inventory
      changed_when: false

    - name: Parse Hyper-V inventory
      ansible.builtin.set_fact:
        discovered_vms: "{{ hyperv_inventory.output[0] | from_json }}"

    - name: Display inventory summary
      ansible.builtin.debug:
        msg:
          hypervisor: "{{ inventory_hostname }}"
          vm_count: "{{ discovered_vms | length }}"
          virtual_machines: "{{ discovered_vms | map(attribute='Name') | list }}"

    - name: Display discovered VM information
      ansible.builtin.debug:
        msg:
          name: "{{ item.Name }}"
          vm_id: "{{ item.VMId }}"
          hypervisor: "{{ item.Hypervisor }}"
          state: "{{ item.State }}"
          generation: "{{ item.Generation }}"
          vcpus: "{{ item.ProcessorCount }}"
          startup_memory_mb: "{{ item.MemoryStartupMB }}"
          assigned_memory_mb: "{{ item.MemoryAssignedMB }}"
          dynamic_memory: "{{ item.DynamicMemoryEnabled }}"
          network_adapters: "{{ item.NetworkAdapters }}"
          hard_disks: "{{ item.HardDisks }}"
      loop: "{{ discovered_vms }}"
      loop_control:
        label: "{{ item.Name }}"
